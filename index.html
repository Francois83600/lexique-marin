<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lexique marin">
<meta name="theme-color" content="#0b5c8f">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Quiz Lexique marin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning game: playful, clear, encouraging
   IDEA a ship's logbook where every rank is a maritime signal flag and points are nautical miles
   PICTURE the question card: a large photo or drawing of the word, edge to edge
   COLOUR sea blue band, white cards, signal yellow accent, green / red for right / wrong
   TYPE Baloo 2 for titles and scores, Nunito for text
   LAYOUT one phone column (max 560px) with a bottom tab bar; same column centred on a laptop */
:root{color-scheme:light dark;--bg:light-dark(#e8f3fa,#061f34);--card:light-dark(#ffffff,#0c2f4c);--ink:light-dark(#0b2236,#eaf4fb);--mut:light-dark(#4b6374,#9fb7c8);--line:light-dark(#d2e2ed,#1c4565);--soft:light-dark(#f1f7fb,#0a2840);--sea:#0b5c8f;--deep:#073e62;--sun:#ffcf33;--sunink:#3a2c00;--ok:#1f9d55;--ko:#e2353d;--okbg:light-dark(#e2f5e9,#0f3a26);--kobg:light-dark(#fde7e8,#45161b);--seatxt:light-dark(#0b5c8f,#7cc4ef);--disp:'Baloo 2','Trebuchet MS',system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
img{max-width:100%;display:block}
.top{background:var(--sea);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;background:radial-gradient(circle at 10px -4px,var(--sea) 11px,transparent 12px) 0 0/20px 12px repeat-x}
.topin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font:800 1.25rem/1 var(--disp);margin-right:auto;white-space:nowrap}
.brand svg{width:26px;height:20px;border-radius:2px}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 11px;font-weight:800;white-space:nowrap;font-size:.95rem}
.pill svg{width:16px;height:16px}
.icon-btn{background:rgba(255,255,255,.16);border:0;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:#fff}
.icon-btn svg{width:18px;height:18px}
main{max-width:560px;margin:0 auto;padding:22px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--disp);line-height:1.05;margin:0;letter-spacing:-.01em}
h1{font-size:2rem}
h2{font-size:1.45rem;margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.mut{color:var(--mut)}
.small{font-size:.88rem}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.btn{border:0;border-radius:14px;min-height:48px;padding:10px 18px;font-weight:800;background:var(--sea);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sun{background:var(--sun);color:var(--sunink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.wide{width:100%}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
.rank{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.flag{width:64px;height:46px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.18);overflow:hidden;border:1px solid rgba(0,0,0,.15)}
.flag svg{width:100%;height:100%;display:block}
.rank h3{font-size:1.5rem}
.bar{height:10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.bar.sea i{background:var(--sea)}
.bar.ok i{background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--soft);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font:800 1.5rem/1.1 var(--disp);white-space:nowrap}
.kpi span{font-size:.8rem;color:var(--mut)}
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px 10px 10px;width:100%}
.mode:hover{border-color:var(--sea)}
.mode .ic{width:76px;height:60px;border-radius:12px;overflow:hidden;display:grid;place-items:center;font:800 1.2rem var(--disp);color:#fff}
.mode .ic img{width:100%;height:100%;object-fit:cover}
.mode b{font:800 1.2rem/1.1 var(--disp);display:block}
.mode .pc{font:800 1.3rem var(--disp);color:var(--sea)}
:root[data-theme=dark] .mode .pc{color:#7cc4ef}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .mode .pc{color:#7cc4ef}}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;min-height:42px;font-weight:700;padding:6px 8px}
.seg button[aria-pressed=true]{background:var(--sea);color:#fff}
.seg button[disabled]{opacity:.35;cursor:default}
.lbl{font-weight:800;margin:16px 0 6px;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--c,var(--line));background:transparent;border-radius:999px;padding:6px 13px;font-weight:700;font-size:.9rem;min-height:38px}
.chip[aria-pressed=true]{background:var(--c,var(--sea));color:#fff}
.hint{background:color-mix(in srgb,var(--sun) 25%,var(--card));border:1px solid color-mix(in srgb,var(--sun) 60%,transparent);border-radius:14px;padding:12px 14px;font-size:.92rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:.8rem;line-height:1.2}
.badge svg{width:40px;height:40px;margin:0 auto 4px;display:block}
.badge b{display:block;font-size:.86rem;margin-bottom:2px}
.badge.off{opacity:.42;filter:grayscale(1)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:10}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--mut);min-height:52px;border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current=page]{color:var(--sea)}
:root[data-theme=dark] .nav button[aria-current=page]{color:#7cc4ef}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .nav button[aria-current=page]{color:#7cc4ef}}
/* quiz */
.qtop{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:14px}
.qtop .x{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.qscore{font:800 1.25rem var(--disp);white-space:nowrap}
.combo{display:inline-block;background:var(--sun);color:var(--sunink);border-radius:99px;padding:0 9px;font-size:.95rem;margin-left:6px;vertical-align:2px}
.prompt{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative}
.prompt .pic{aspect-ratio:3/2;background:#fff;display:grid;place-items:center}
.prompt .pic img{width:100%;height:100%;object-fit:contain}
.prompt .word{padding:52px 18px 34px;text-align:center;font:800 clamp(1.7rem,7vw,2.4rem)/1.1 var(--disp);text-wrap:balance}
.prompt .lang{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center;background:var(--card);border-radius:99px;padding:3px 10px 3px 4px;font-size:.8rem;font-weight:800;border:1px solid var(--line)}
.prompt .lang svg{width:24px;height:16px;border-radius:2px}
.say{border:0;background:var(--soft);border-radius:99px;width:44px;height:44px;display:inline-grid;place-items:center;color:var(--sea);vertical-align:middle}
.say svg{width:22px;height:22px}
.prompt .say{position:absolute;top:8px;right:8px;background:var(--card);border:1px solid var(--line)}
.ask{font-weight:700;color:var(--mut);margin:14px 2px 10px}
.opts{display:grid;gap:10px}
.opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 14px;text-align:left;font-weight:800;font-size:1.05rem;width:100%}
.opt kbd{flex:none;width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font:800 .85rem Nunito,sans-serif;color:var(--mut)}
.opt:hover:not([disabled]){border-color:var(--sea)}
.opt.pic{padding:6px;flex-direction:column;align-items:stretch;gap:0}
.opt.pic img{aspect-ratio:3/2;object-fit:cover;width:100%;border-radius:10px;background:#fff}
.opt.pic kbd{position:absolute;margin:6px}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--ko);background:var(--kobg)}
.opt.gone{visibility:hidden}
.typing{display:flex;gap:10px}
.typing input{flex:1;min-height:54px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:10px 14px;font-size:1.1rem;font-weight:700}
.jokers{display:flex;gap:10px;margin-top:12px;justify-content:center}
.jk{border:2px dashed var(--line);background:transparent;border-radius:99px;padding:6px 14px;font-weight:800;font-size:.9rem;min-height:40px}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .25s ease-out;border-top:3px solid}
.fb.show{transform:none}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.ko{background:var(--kobg);border-color:var(--ko)}
.fbin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:center}
.fbin img{width:88px;height:66px;object-fit:cover;border-radius:10px;background:#fff}
.fb h3{font-size:1.4rem}
.fb.ok h3{color:var(--ok)}
.fb.ko h3{color:var(--ko)}
.fb .btn{grid-column:1/-1}
.us{display:inline-block;font-size:.75rem;font-weight:800;background:color-mix(in srgb,var(--sun) 40%,var(--card));border:1px solid #d9a400;border-radius:6px;padding:0 6px;white-space:nowrap;vertical-align:1px}
.timer{height:12px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--sea);transition:width .25s linear}
.timer.low i{background:var(--ko)}
/* results */
.res{text-align:center}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.stars svg{width:46px;height:46px}
.big{font:800 clamp(3rem,15vw,4.5rem)/1 var(--disp);color:var(--sea)}
:root[data-theme=dark] .big{color:#7cc4ef}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .big{color:#7cc4ef}}
.miss{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.miss img{width:64px;height:48px;object-fit:cover;border-radius:8px;background:#fff}
/* lexique */
.search{width:100%;min-height:48px;border:2px solid var(--line);border-radius:999px;background:var(--card);padding:10px 18px;font-size:16px}
.lex{display:grid;gap:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lexrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px 8px 8px;border-bottom:1px solid var(--line)}
.lexrow:last-child{border-bottom:0}
.lexrow img{width:76px;height:57px;object-fit:cover;border-radius:10px;background:#fff;border:2px solid color-mix(in srgb,var(--c) 45%,transparent)}
.lexrow .fr{font-weight:800}
.lexrow .en{font-weight:700;color:var(--c)}
:root[data-theme=dark] .lexrow .en{color:color-mix(in srgb,var(--c) 45%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .lexrow .en{color:color-mix(in srgb,var(--c) 45%,#fff)}}
.dots{display:flex;gap:3px;margin-top:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.flash{perspective:1200px;margin-top:6px}
.fc{position:relative;width:100%;aspect-ratio:4/3.6;transition:transform .5s;transform-style:preserve-3d;border:0;padding:0;background:transparent}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto}
.face img{width:100%;height:100%;object-fit:contain;background:#fff}
.face p{margin:0;padding:12px;font-weight:700;color:var(--mut)}
.face.back{transform:rotateY(180deg);grid-template-rows:auto;place-content:center;text-align:center;padding:20px;gap:10px}
.face.back .f1{font:800 1.9rem/1.1 var(--disp)}
.face.back .f2{font:800 1.6rem/1.1 var(--disp);color:var(--sea)}
:root[data-theme=dark] .face.back .f2{color:#7cc4ef}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .face.back .f2{color:#7cc4ef}}
details{margin-top:18px;font-size:.85rem;color:var(--mut)}
details summary{cursor:pointer;font-weight:800;color:var(--ink)}
details ul{padding-left:18px}
details a{color:inherit;overflow-wrap:anywhere}
/* progress */
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:600px){.gauges{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gauge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.gauge svg{width:84px;height:84px;display:block;margin:0 auto}
.gauge b{display:block;font:800 1rem/1.1 var(--disp);margin-top:4px}
.gauge span{font-size:.78rem;color:var(--mut)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:4px 10px;align-items:center;margin-bottom:10px}
.trow .bar{grid-column:1/-1;margin:0}
.trow .bar i{background:var(--c)}
.trow b{text-align:right;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(3,20,34,.55);display:grid;place-items:center;z-index:40;padding:20px}
.modal .card{max-width:380px;width:100%}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-220%);visibility:hidden;background:var(--sun);color:var(--sunink);font-weight:800;padding:10px 18px;border-radius:999px;z-index:50;transition:transform .3s;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:45;animation:fall 1.8s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.pop{animation:pop .3s}
@media (prefers-reduced-motion:reduce){.conf{display:none}.pop{animation:none}.fc{transition:none}.fb{transition:none}}
@media (min-width:600px){.opts:not(.pics){grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:2.4rem}}
.hidden{display:none!important}
.due{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:color-mix(in srgb,var(--sea) 12%,var(--card));border:1.5px solid color-mix(in srgb,var(--sea) 40%,transparent);border-radius:16px;padding:12px 14px;margin-top:14px}
.due svg{width:30px;height:30px;color:var(--seatxt)}
.due b{display:block;font:800 1.1rem/1.15 var(--disp)}
.listen{display:grid;place-items:center;padding:30px 16px;gap:10px}
.listen .bigsay{width:96px;height:96px;border-radius:50%;border:0;background:var(--sea);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--deep)}
.listen .bigsay svg{width:46px;height:46px}
.listen .bigsay:active{transform:translateY(3px);box-shadow:0 3px 0 var(--deep)}
.sent{padding:26px 18px;text-align:center;font:700 clamp(1.15rem,4.6vw,1.45rem)/1.4 var(--disp);text-wrap:balance}
.sent u{text-decoration:none;display:inline-block;min-width:4.5em;border-bottom:3px solid var(--sun);color:var(--seatxt)}
.games{display:grid;gap:10px;margin-top:6px}
.game{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.game:hover{border-color:var(--sea)}
.game .gi{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;color:#fff}
.game .gi svg{width:28px;height:28px}
.game b{font:800 1.1rem/1.15 var(--disp);display:block}
.fbmedia{width:88px}
.fbmedia img,.fbmedia svg{width:88px;height:66px;object-fit:cover;border-radius:10px;background:#fff;display:block}
.btabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px 10px;padding:0 4px 2px}
.btabs button{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem;min-height:34px}
.btabs button[aria-pressed=true]{background:var(--sea);border-color:var(--sea);color:#fff}
.cd{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:.88rem;margin-top:10px}
.cd b{font:800 1.05rem var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.promo .flag{width:150px;height:108px;margin:6px auto 14px;animation:hoist 1s ease-out}
@keyframes hoist{0%{transform:translateY(60px) scale(.6);opacity:0}70%{transform:translateY(-6px) scale(1.04);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.promo .flag{animation:none}}
.flaggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:6px;align-content:start}
.fsvg svg{width:100%;height:auto;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.fcard .fl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.fcard .fl b{font:800 1.15rem/1 var(--disp)}
.fcard .ffr{font-weight:700;font-size:.9rem;line-height:1.3}
.fcard .fen{font-size:.85rem;line-height:1.3;color:var(--seatxt)}
.bigflag{width:min(62%,280px);margin:18px auto}
.bigflag svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.opt.long{font-size:.95rem;font-weight:700;line-height:1.3}
.opt.fpic{padding:12px;justify-content:center;position:relative}
.opt.fpic svg{width:100%;max-width:150px;height:auto;display:block}
.opt.fpic kbd{position:absolute;top:6px;left:6px}
.fbflag{width:88px}
.fbflag svg{width:88px;height:auto;display:block}
.pavcta{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.pavcta:hover{border-color:var(--sea)}
.pavcta .mini{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.pavcta .mini svg{width:100%;height:auto;display:block}
.pavcta b{font:800 1.2rem/1.1 var(--disp);display:block}

.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin:6px 0 14px}
.pod{text-align:center;min-width:0}
.pod .flag{margin:0 auto 6px;width:52px;height:38px}
.pod .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pt{font:800 1.05rem var(--disp);color:var(--seatxt);white-space:nowrap}
.pod .step{margin-top:6px;border-radius:12px 12px 0 0;background:var(--sea);color:#fff;font:800 1.6rem/1 var(--disp);display:grid;place-items:center}
.pod.p1 .step{height:92px;background:#d9a400;color:var(--sunink)}
.pod.p2 .step{height:68px;background:#8fa3b3}
.pod.p3 .step{height:52px;background:#b8743a}
.lbrow{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.lbrow:last-child{border-bottom:0}
.lbrow .pos{font:800 1.05rem var(--disp);color:var(--mut);text-align:center}
.lbrow .flag{width:40px;height:29px}
.lbrow .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .pt{font:800 1.05rem var(--disp);white-space:nowrap;font-variant-numeric:tabular-nums}
.lbrow.me,.pod.me .nm{color:var(--seatxt)}
.lbrow.me{background:color-mix(in srgb,var(--sun) 22%,transparent);border-radius:10px}
.del{border:0;background:transparent;color:var(--mut);width:32px;height:32px;border-radius:8px;font-size:1.1rem;line-height:1}
.code{width:100%;min-height:76px;border:2px dashed var(--line);border-radius:12px;background:var(--soft);padding:10px;font:600 .8rem/1.4 ui-monospace,Menlo,monospace;overflow-wrap:anywhere;resize:vertical}

body.inquiz main{padding-bottom:calc(240px + env(safe-area-inset-bottom,0px))}
.hscroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:4px}
.hscroll .chip{flex:none}
.seatxt{color:var(--seatxt);font-weight:700}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="topin">
    <div class="brand"><svg viewBox="0 0 30 22" aria-hidden="true"><rect width="30" height="22" fill="#fff"/><rect x="7" y="5" width="16" height="12" fill="#0b5c8f"/><rect width="30" height="22" fill="none" stroke="#0b5c8f" stroke-width="5"/></svg>Lexique marin</div>
    <span class="pill" title="Milles parcourus (points)"><svg viewBox="0 0 24 24" fill="none" stroke="#ffcf33" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M12 7l2 5-2 5-2-5z"/></svg><span id="hpts">0</span></span>
    <span class="pill" title="Jours d'affilée"><svg viewBox="0 0 24 24" fill="#ffcf33"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg><span id="hstreak">0</span></span>
    <button class="icon-btn" id="snd" aria-label="Son activé" title="Son"></button>
  </div>
</header>
<main id="v" aria-live="polite"></main>
<nav class="nav" id="nav" aria-label="Navigation"><div>
  <button data-go="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-go="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z" fill="currentColor"/></svg>Quiz</button>
  <button data-go="pav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 21V3"/><path d="M5 4h13l-3 4.5 3 4.5H5"/></svg>Pavillons</button>
  <button data-go="lex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h6"/></svg>Lexique</button>
  <button data-go="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progrès</button>
</div></nav>
<div class="fb" id="fb" role="status"></div>
<div class="toast" id="toast"></div>
<script>
{
const $=s=>document.querySelector(s), V=$('#v');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=(a,r=Math.random)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function seeded(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
const today=()=>new Date().toLocaleDateString('sv');
const KEY='lexmarin.v1';
const FRESH={name:'',pts:0,streak:0,last:'',day:'',dayPts:0,daily:'',m:{},st:{},wrong:{},badges:[],quizzes:0,typedOk:0,sound:true,cfg:{q:'img',a:'en',fmt:'qcm',n:10,th:[]},bestChrono:0,tipOff:false,week:'',weekPts:0,pid:'',pushed:-1,pushedName:'',uid:'',rt:'',fm:{},fcfg:{mode:'sig',n:10},wPts:0,fPts:0,secMig:0,dayKey:'',dayScore:0,pushedKey:'',ls:{},fls:{},xm:{},xls:{}};
let S=load(), W=[], SECS=[], SEC={}, Q=null;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return Object.assign(structuredClone(FRESH),d)}catch(e){}return structuredClone(FRESH)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- flags & ranks ---------- */
const FL={
 P:'<rect width="30" height="22" fill="#1f5fae"/><rect x="9" y="6" width="12" height="10" fill="#fff"/>',
 O:'<rect width="30" height="22" fill="#ffcf33"/><path d="M0 0H30V22Z" fill="#e2353d"/>',
 C:'<rect width="30" height="22" fill="#1f5fae"/><rect y="4.4" width="30" height="13.2" fill="#fff"/><rect y="8.8" width="30" height="4.4" fill="#e2353d"/>',
 K:'<rect width="15" height="22" fill="#ffcf33"/><rect x="15" width="15" height="22" fill="#1f5fae"/>',
 U:'<rect width="30" height="22" fill="#fff"/><rect width="15" height="11" fill="#e2353d"/><rect x="15" y="11" width="15" height="11" fill="#e2353d"/>',
 H:'<rect width="15" height="22" fill="#fff"/><rect x="15" width="15" height="22" fill="#e2353d"/>',
 N:Array.from({length:16},(_, i)=>`<rect x="${(i%4)*7.5}" y="${Math.floor(i/4)*5.5}" width="7.5" height="5.5" fill="${(i%4+Math.floor(i/4))%2?'#fff':'#1f5fae'}"/>`).join(''),
 Z:'<path d="M0 0H30L15 11Z" fill="#111"/><path d="M30 0V22L15 11Z" fill="#e2353d"/><path d="M0 22H30L15 11Z" fill="#1f5fae"/><path d="M0 0V22L15 11Z" fill="#ffcf33"/>'
};
const flag=k=>`<svg viewBox="0 0 30 22" aria-hidden="true">${FL[k]}</svg>`;
const RANKS=[[0,'Moussaillon','P'],[150,'Matelot','O'],[400,'Quartier-maître','C'],[800,'Bosco','K'],[1500,'Second','U'],[2500,'Capitaine','H'],[4000,'Commandant','N'],[6000,'Amiral','Z']];
const rankOf=p=>{let i=0;RANKS.forEach((r,j)=>{if(p>=r[0])i=j});return i};
const UK='<svg viewBox="0 0 60 40" aria-hidden="true"><rect width="60" height="40" fill="#1f3f8f"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#e2353d" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="12"/><path d="M30 0V40M0 20H60" stroke="#e2353d" stroke-width="7"/></svg>';
const FRF='<svg viewBox="0 0 60 40" aria-hidden="true"><rect width="20" height="40" fill="#1f3f8f"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#e2353d"/></svg>';
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>';
const STAR=on=>`<svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z" fill="${on?'#ffcf33':'var(--line)'}" stroke="${on?'#c99a00':'none'}"/></svg>`;

/* ---------- badges ---------- */
const BADGES=[
 ['premier','Premier bord','Finir un premier quiz','P'],
 ['sansfaute','Sans faute','100 % sur 10 questions ou plus','O'],
 ['combo10','Vent arrière','Enchaîner 10 bonnes réponses','K'],
 ['oeil','Œil de lynx','Maîtriser 30 % des mots en mode photo','C'],
 ['plume','Plume de capitaine','20 bonnes réponses écrites','U'],
 ['rafale','Rafale','15 bonnes réponses en Chrono','N'],
 ['fidele','Fidèle au poste','Jouer 3 jours d’affilée','H'],
 ['semaine','Une semaine en mer','Jouer 7 jours d’affilée','Z'],
 ['tour','Tour complet','Rencontrer les 104 mots','N'],
 ['repeche','Repêché','Réussir un mot raté auparavant','O'],
 ['defi','Défi relevé','Réussir le défi du jour','K'],
 ['capitaine','Capitaine','Atteindre 2 500 milles','H'],
 ['signaux','Code des signaux','Sans faute sur 10 pavillons ou plus','Z']];
function award(id){if(S.badges.includes(id))return;S.badges.push(id);const b=BADGES.find(x=>x[0]===id);toast('Nouveau badge : '+b[1]);sfx('badge');save()}

/* ---------- sound & speech ---------- */
let AC=null;
function sfx(t){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const seq={ok:[[660,.08],[880,.12]],ko:[[220,.18],[170,.22]],combo:[[660,.06],[880,.06],[1100,.12]],badge:[[523,.1],[659,.1],[784,.1],[1046,.2]],end:[[392,.12],[523,.12],[659,.12],[784,.25]]}[t]||[];let at=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t==='ko'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,at);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g).connect(AC.destination);o.start(at);o.stop(at+d);at+=d*.9})}catch(e){}}
function say(txt,lang='en-GB'){try{const u=new SpeechSynthesisUtterance(txt.replace(/\s\/\s/g,', ').replace(/\(.*?\)/g,''));u.lang=lang;const vs=speechSynthesis.getVoices();const v=vs.find(v=>v.lang===lang)||vs.find(v=>v.lang.startsWith(lang.slice(0,2)));if(v)u.voice=v;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function sndIcon(){$('#snd').innerHTML=S.sound?'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#fff"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#fff"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';$('#snd').setAttribute('aria-label',S.sound?'Couper le son':'Activer le son')}

/* ---------- learning model (Leitner boxes 0-5 per word and mode) ---------- */
const box=(id,mode)=>S.m[id]?.[mode]||0;
function setBox(id,mode,ok){S.m[id]=S.m[id]||{};const b=box(id,mode);S.m[id][mode]=ok?Math.min(5,b+1):Math.max(0,b-2)}
const qModes=q=>['fr','en','img'].filter(a=>a!==q).map(a=>q+'>'+a);
const CANSPEAK='speechSynthesis' in window;
const wordLevel=(id,q)=>Math.max(...qModes(q).map(m=>box(id,m)));
const mastery=(q,list=W)=>list.length?Math.round(100*list.reduce((s,w)=>s+wordLevel(w.id,q),0)/(5*list.length)):0;
const allLevel=w=>Math.max(wordLevel(w.id,'fr'),wordLevel(w.id,'en'),wordLevel(w.id,'img'),wordLevel(w.id,'audio'));
/* spaced repetition : a word is due again after 0, 1, 2, 4, 8 or 16 days depending on its level */
const SRD=[0,1,2,4,8,16];
const isDue=(lvl,ts)=>!!ts&&Date.now()-ts>=SRD[Math.min(5,lvl)]*864e5-36e5;
const dueWords=()=>W.filter(w=>S.m[w.id]&&isDue(allLevel(w),S.ls[w.id]));
const dueFlags=()=>PAV.filter(p=>S.fm[p.id]&&isDue(fLevel(p),S.fls[p.id]));
const seenCount=()=>W.filter(w=>S.m[w.id]).length;

/* ---------- answer checking ---------- */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\b(to|the|a|an|le|la|les|l|un|une|du|de|des)\b/g,' ').replace(/\s+/g,' ').trim();
function variants(w,lang){const raw=lang==='en'?[w.en,...(w.us?w.us.split('/'):[])]:[w.fr];const out=new Set();raw.forEach(r=>{out.add(norm(r));r.split('/').forEach(p=>{out.add(norm(p));out.add(norm(p.replace(/\(.*?\)/g,'')));const m=p.match(/\((.*?)\)/);if(m)out.add(norm(m[1]))})});out.delete('');return[...out]}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function check(w,lang,txt){const t=norm(txt);if(!t)return 0;const vs=variants(w,lang);if(vs.includes(t))return 2;for(const v of vs){const tol=v.length>=8?2:v.length>=4?1:0;if(lev(v,t)<=tol)return 1}return 0}

/* ---------- streak & points ---------- */
function touchDay(){const d=today();if(S.day!==d){S.day=d;S.dayPts=0}if(S.last!==d){const y=new Date(Date.now()-864e5).toLocaleDateString('sv');S.streak=S.last===y?S.streak+1:1;S.last=d;if(S.streak>=3)award('fidele');if(S.streak>=7)award('semaine')}}
function addPts(p,sec='w'){const before=rankOf(S.pts);S.pts+=p;S.dayPts+=p;if(sec==='f')S.fPts+=p;else S.wPts+=p;const wk=weekKey();if(S.week!==wk){S.week=wk;S.weekPts=0}S.weekPts+=p;const after=rankOf(S.pts);if(after>before)promo(after);if(S.pts>=2500)award('capitaine');header()}
function promo(i){confetti();sfx('badge');const nx=RANKS[i+1];const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card promo pop" role="dialog" aria-modal="true" style="text-align:center"><div class="mut small">Promotion</div><div class="flag">${flag(RANKS[i][2])}</div><h2 style="margin:0 0 6px;font-size:1.8rem">${RANKS[i][1]} !</h2><p class="mut" style="margin:0 0 16px">${nx?`Prochain grade : ${nx[1]} à ${nx[0].toLocaleString('fr')} milles.`:'Tu as atteint le plus haut grade. Respect, Amiral !'}</p><button class="btn sun wide">Merci, capitaine</button></div>`;document.body.appendChild(m);m.querySelector('button').onclick=()=>m.remove()}
function header(){$('#hpts').textContent=S.pts.toLocaleString('fr');$('#hstreak').textContent=S.streak&&(S.last===today()||S.last===new Date(Date.now()-864e5).toLocaleDateString('sv'))?S.streak:0;sndIcon()}

/* ---------- UI helpers ---------- */
let tt=null;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#ffcf33','#e2353d','#1f5fae','#1f9d55','#fff'];for(let i=0;i<60;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];c.style.animationDelay=Math.random()*.6+'s';c.style.animationDuration=1.4+Math.random()*1.2+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3400)}}
function modal(html,onYes){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card pop" role="dialog" aria-modal="true">${html}<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" data-no>Annuler</button><button class="btn" data-yes style="background:var(--ko)">Confirmer</button></div></div>`;document.body.appendChild(m);m.querySelector('[data-no]').onclick=()=>m.remove();m.querySelector('[data-yes]').onclick=()=>{m.remove();onYes()};m.onclick=e=>{if(e.target===m)m.remove()}}
const thumb=w=>`<img src="${esc(w.img)}" alt="" loading="lazy">`;
let view='home';
function go(v){view=v;Q=null;FQ=null;MQ=null;hideFb();document.body.classList.remove('inquiz');$('#nav').classList.remove('hidden');document.querySelectorAll('[data-go]').forEach(b=>b.toggleAttribute('aria-current',b.dataset.go===v)&&b.setAttribute('aria-current','page'));({home,play,lex,prog,pav})[v]();scrollTo(0,0)}

/* ---------- HOME ---------- */
const MODEINFO={en:['Mot anglais','Je lis le mot anglais, je trouve le français'],fr:['Mot français','Je lis le mot français, je trouve l’anglais'],img:['Photo seule','Je vois l’image, je trouve le mot'],audio:['À l’oreille','J’écoute le mot anglais, je trouve l’image']};
function home(){
 const r=rankOf(S.pts),nx=RANKS[r+1],pc=nx?Math.round(100*(S.pts-RANKS[r][0])/(nx[0]-RANKS[r][0])):100;
 const dayDone=S.daily===today(),errs=errList().length,goal=100,dp=S.day===today()?S.dayPts:0;
 const sample=W.find(w=>w.id===18)||W[0];
 V.innerHTML=`
 <div class="card rank">
  <div class="flag">${flag(RANKS[r][2])}</div>
  <div><div class="mut small">${S.name?esc(S.name)+', ':''}ton grade</div><h3>${RANKS[r][1]}</h3>
  <div class="bar"><i style="width:${pc}%"></i></div>
  <div class="mut small" style="margin-top:4px">${nx?`${(nx[0]-S.pts).toLocaleString('fr')} milles avant ${nx[1]}`:'Grade maximal atteint, bravo !'}</div></div>
 </div>
 <div class="kpis">
  <div class="kpi"><b>${S.pts.toLocaleString('fr')}</b><span>milles</span></div>
  <div class="kpi"><b>${Math.min(dp,goal)}/${goal}</b><span>objectif du jour</span></div>
  <div class="kpi"><b>${seenCount()}/104</b><span>mots vus</span></div>
 </div>
 ${(()=>{const n=dueWords().length;return n?`<div class="due"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span><b>${n} mot${n>1?'s':''} à revoir aujourd’hui</b><span class="mut small">C’est le bon moment pour ne pas les oublier.</span></span><button class="btn" id="godue">Réviser</button></div>`:''})()}
 <button class="btn sun wide" id="daily" style="margin-top:14px;min-height:56px" ${dayDone?'disabled':''}>${dayDone?'Défi du jour relevé : '+(S.dayKey===today()?S.dayScore:0)+' milles':'Défi du jour : les mêmes 10 questions pour tous, points doublés'}</button>
 <div class="card" id="top3" style="margin-top:14px"></div>
 <h2>Jouer</h2>
 <div class="modes">${['en','fr','img'].concat(CANSPEAK?['audio']:[]).map(q=>`<button class="mode" data-q="${q}"><span class="ic" style="background:${q==='en'?'#1f3f8f':q==='fr'?'#e2353d':q==='audio'?'var(--sea)':'#fff'}">${q==='img'?thumb(sample):q==='audio'?'<span style="width:40px;color:#fff">'+SPK+'</span>':q==='en'?'<span style="width:56px">'+UK+'</span>':'<span style="width:56px">'+FRF+'</span>'}</span><span><b>${MODEINFO[q][0]}</b><span class="mut small">${MODEINFO[q][1]}</span></span><span class="pc">${mastery(q)}%</span></button>`).join('')}</div>
 <div class="row wrap" style="margin-top:12px"><button class="btn ghost" id="errs" ${errs?'':'disabled'} style="flex:1">Revoir mes erreurs (${errs})</button><button class="btn ghost" id="cards" style="flex:1">Cartes mémoire</button></div>
 ${S.tipOff?'':`<div class="hint" style="margin-top:18px"><b>Sur iPhone :</b> dans Safari, touche Partager puis « Sur l’écran d’accueil » pour l’ouvrir comme une app. <button class="jk" id="tipx" style="margin-left:6px;min-height:32px">OK</button></div>`}
 <h2>Pavillons</h2>
 <button class="pavcta" id="gopav"><span class="mini">${['A','N','C','Z'].map(flagSvg).join('')}</span><span><b>Pavillons de signalisation</b><span class="mut small">${PAV.length} pavillons du Code international : lexique et quiz à part</span></span><span class="pc">${fMastery()}%</span></button>
 <h2>Badges <span class="mut small">${S.badges.length}/${BADGES.length}</span></h2>

/* ---------- QUIZ ENGINE ---------- */
function pickPool(cfg){
 let pool=W.filter(w=>!cfg.th?.length||cfg.th.includes(w.s));
 if(cfg.src==='err'){pool=errList();}
 if(cfg.src==='due'){pool=dueWords();}
 if(!pool.length)pool=W.slice();
 const mode=cfg.q==='mix'?null:cfg.q+'>'+cfg.a;
 return pool.map(w=>({w,k:(mode?box(w.id,mode):allLevel(w))+Math.random()*2.5})).sort((a,b)=>a.k-b.k).map(x=>x.w);
}
function start(cfg){
 touchDay();
 const rng=cfg.daily?seeded('defi-'+today()):Math.random;
 const pool=cfg.daily?shuffle(W.slice(),rng):pickPool(cfg);
 const n=cfg.fmt==='chrono'?999:Math.min(cfg.n||10,pool.length);
 Q={rng,cfg,pool,list:cfg.fmt==='chrono'?shuffle(pool.slice()):pool.slice(0,n),i:0,n,score:0,ok:0,combo:0,best:0,misses:[],fifty:2,hints:3,t0:Date.now(),left:60,timer:null,locked:false};
 if(!cfg.daily)Q.list=shuffle(Q.list);
 document.body.classList.add('inquiz');$('#nav').classList.add('hidden');
 if(cfg.fmt==='chrono'){Q.timer=setInterval(()=>{if(Q.locked&&Q.left>0){} Q.left=Math.max(0,Q.left-.25);const t=$('#tm');if(t){t.querySelector('i').style.width=Math.min(100,Q.left/60*100)+'%';t.classList.toggle('low',Q.left<10);$('#tml').textContent=Math.ceil(Q.left)+' s'}if(Q.left<=0)end()},250)}
 ask();
}
function curMode(){const c=Q.cfg;if(c.q!=='mix')return[c.q,c.a];const ms=[['en','fr'],['fr','en'],['img','en'],['img','fr'],['en','img']];return ms[Math.floor(Q.rng()*ms.length)]}
function ask(){
 hideFb();
 if(Q.cfg.fmt==='chrono'&&Q.i>=Q.list.length){Q.list=Q.list.concat(shuffle(Q.pool.slice()))}
 const w=Q.list[Q.i];const [q,a]=curMode();Q.cur={w,q,a,t:Date.now(),fifty:false,hint:false};Q.locked=false;
 const opts=a==='img'||Q.cfg.fmt!=='type'?distract(w,a):null;Q.cur.opts=opts;
 const chrono=Q.cfg.fmt==='chrono';
 const promptHtml=q==='audio'?`<div class="listen"><button class="bigsay" id="sayq" aria-label="Réécouter le mot">${SPK}</button><span class="mut small">Touche pour réécouter</span></div>`:q==='img'?`<div class="pic"><img src="${esc(w.img)}" alt="Image à reconnaître"></div>`:`<div class="word"><span class="lang">${q==='en'?UK+'Anglais':FRF+'Français'}</span>${esc(q==='en'?w.en:w.fr)}</div>${q==='en'?`<button class="say" id="sayq" aria-label="Écouter la prononciation">${SPK}</button>`:''}`;
 const askTxt=q==='audio'?(a==='img'?'Quelle image correspond au mot entendu ?':a==='en'?(Q.cfg.fmt==='type'?'Écris le mot entendu (en anglais)':'Quel mot as-tu entendu ?'):'Comment dit-on en français ?'):a==='img'?'Quelle image correspond ?':a==='en'?'Comment dit-on en anglais ?':'Comment dit-on en français ?';
 V.innerHTML=`<div class="qtop"><button class="x" id="quit" aria-label="Quitter le quiz"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
 ${chrono?`<div><div class="timer" id="tm"><i style="width:${Q.left/60*100}%"></i></div><div class="mut small" id="tml">${Math.ceil(Q.left)} s</div></div>`:`<div><div class="bar sea"><i style="width:${Q.i/Q.n*100}%"></i></div><div class="mut small">Question ${Q.i+1} sur ${Q.n}</div></div>`}
 <div class="qscore">${Q.score}<span class="combo ${Q.combo>=3?'':'hidden'}">×${mult()}</span></div></div>

 ${opts?`<div class="opts ${a==='img'?'pics':''}">${opts.map((o,i)=>a==='img'?`<button class="opt pic" data-i="${i}" style="position:relative"><kbd>${i+1}</kbd><img src="${esc(o.img)}" alt="Choix ${i+1}"></button>`:`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(a==='en'?o.en:o.fr)}</span></button>`).join('')}</div>`
 :`<form class="typing" id="tf"><input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${a==='en'?'Réponse en anglais':'Réponse en français'}" enterkeyhint="done"><button class="btn">Valider</button></form>`}

 $('#quit').onclick=()=>{if(Q.i===0&&!Q.ok){stopQ();go('home');return}modal('<h3>Quitter le quiz ?</h3><p class="mut">Les milles déjà gagnés sont conservés.</p>',()=>end())};
 $('#sayq')?.addEventListener('click',()=>say(w.en));
 if(q==='audio')say(w.en);
 else if(q==='en'&&S.sound&&!chrono)setTimeout(()=>Q&&Q.cur?.w===w&&say(w.en),250);
 V.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 const tf=$('#tf');if(tf){tf.onsubmit=e=>{e.preventDefault();answer($('#ans').value)};setTimeout(()=>$('#ans')?.focus(),60)}

 $('#jh')?.addEventListener('click',()=>{if(!Q.hints||Q.cur.hint)return;Q.hints--;Q.cur.hint=true;const t=(a==='en'?w.en:w.fr).split(' / ')[0];const inp=$('#ans');inp.value=t.slice(0,Math.max(1,Math.ceil(t.length/3)));inp.focus();$('#jh').disabled=true;$('#jh').textContent='Indice ('+Q.hints+')'});
 $('#jskip')?.addEventListener('click',()=>answer(null));
}
function distract(w,a){const r=Q?.rng||Math.random;
 const key=o=>a==='img'?o.img:a==='en'?o.en:o.fr;
 const same=shuffle(W.filter(o=>o.s===w.s&&o.id!==w.id),r),other=shuffle(W.filter(o=>o.s!==w.s),r);
 const out=[w],seen=new Set([key(w)]);
 for(const o of same.concat(other)){if(out.length>=4)break;if(seen.has(key(o)))continue;if(a!=='img'||r()<.85||!same.includes(o)){out.push(o);seen.add(key(o))}}
 return shuffle(out,r);
}
const mult=()=>Q.combo>=10?3:Q.combo>=5?2:Q.combo>=3?1.5:1;
function answer(x){
 if(Q.locked)return;Q.locked=true;
 const {w,q,a}=Q.cur, mode=q+'>'+a, chrono=Q.cfg.fmt==='chrono', typed=typeof x==='string';
 let res=0;
 if(x===null)res=0;else if(typed)res=check(w,a,x);else res=Q.cur.opts[x].id===w.id?2:0;
 const ok=res>0, sec=(Date.now()-Q.cur.t)/1000;
 V.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const o=Q.cur.opts[+b.dataset.i];if(o.id===w.id)b.classList.add('good');else if(+b.dataset.i===x)b.classList.add('bad')});
 const had=S.wrong[w.id]>0;
 setBox(w.id,mode,ok);S.ls[w.id]=Date.now();S.st[mode]=S.st[mode]||{ok:0,n:0};S.st[mode].n++;
 let gain=0;
 if(ok){Q.ok++;Q.combo++;Q.best=Math.max(Q.best,Q.combo);S.st[mode].ok++;
  let base=typed?20:10;if(Q.cur.fifty||Q.cur.hint)base=Math.round(base/2);
  const speed=Math.max(0,5-Math.floor(sec/2));
  gain=Math.round((base+speed)*mult()*(Q.cfg.daily?2:1));Q.score+=gain;
  if(had){S.wrong[w.id]--;if(S.wrong[w.id]<=0)delete S.wrong[w.id];award('repeche')}
  if(typed){S.typedOk++;if(S.typedOk>=20)award('plume')}
  if(Q.combo>=10)award('combo10');
  if(chrono)Q.left=Math.min(60,Q.left+2);
  sfx(Q.combo===3||Q.combo===5||Q.combo===10?'combo':'ok');
 }else{Q.combo=0;S.wrong[w.id]=(S.wrong[w.id]||0)+1;Q.misses.push({w,q,a,given:typed?x:x===null?'':(a==='img'?'':(a==='en'?Q.cur.opts[x].en:Q.cur.opts[x].fr))});if(chrono)Q.left=Math.max(0,Q.left-3);sfx('ko')}
 if(gain)addPts(gain);
 if(mastery('img')>=30)award('oeil');if(seenCount()>=W.length)award('tour');
 save();
 const fb=$('#fb');
 const msg=ok?(res===1?'Presque parfait !':['Bravo !','Exact !','Bien joué !','Parfait !'][Math.floor(Math.random()*4)]):(x===null?'Pas de souci, voici la réponse':'Raté…');
 fb.className='fb '+(ok?'ok':'ko');
 fb.innerHTML=`<div class="fbin"><img src="${esc(w.img)}" alt=""><div><h3>${msg} ${ok?`<span class="small">+${gain} milles</span>`:''}</h3>
  <div style="font-weight:800">${esc(w.fr)} = ${esc(w.en)} ${w.us?`<span class="us">US : ${esc(w.us)}</span>`:''} <button class="say" id="sayf" aria-label="Écouter" style="width:36px;height:36px">${SPK}</button></div>
  ${res===1?`<div class="small">Orthographe exacte : ${esc(a==='en'?w.en:w.fr)}</div>`:''}</div>
  ${chrono?'':`<button class="btn wide" id="nx" style="background:${ok?'var(--ok)':'var(--ko)'}">${Q.i+1>=Q.n?'Voir mon résultat':'Continuer'}</button>`}</div>`;
 requestAnimationFrame(()=>fb.classList.add('show'));
 $('#sayf').onclick=()=>say(w.en);
 if(!ok&&S.sound&&!chrono)say(w.en);
 const qs=V.querySelector('.qscore');if(qs)qs.innerHTML=`${Q.score}<span class="combo ${Q.combo>=3?'':'hidden'}">×${mult()}</span>`;
 if(chrono)setTimeout(()=>{if(Q&&Q.left>0){Q.i++;ask()}},ok?650:1400);
 else{$('#nx').onclick=next;setTimeout(()=>$('#nx')?.focus(),50)}
}

 V.innerHTML=`<h1>Lexique</h1><p class="mut" style="margin:6px 0 12px">${W.length} mots, en français et en anglais britannique. Touche le haut-parleur pour écouter.</p>

 V.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{lexTh=b.dataset.t;fcI=0;lex()});
 const body=$('#lexbody');
 if(lexMode==='list'){
  body.innerHTML=`<input class="search" id="lq" type="search" placeholder="Chercher en français ou en anglais" value="${esc(lexQ)}" style="margin-bottom:12px" aria-label="Chercher un mot"><div class="lex" id="ll"></div>`;
  const draw=()=>{const l=W.filter(w=>(!lexTh||w.s===lexTh)&&(!lexQ||norm(w.fr+' '+w.en+' '+w.us).includes(norm(lexQ))));$('#ll').innerHTML=l.length?l.map(w=>{const lv=allLevel(w);return`<div class="lexrow" style="--c:${esc(SEC[w.s].color)}">${thumb(w)}<div><div class="fr">${esc(w.fr)}</div><div class="en">${esc(w.en)} ${w.us?`<span class="us">US : ${esc(w.us)}</span>`:''}</div><div class="dots" title="Maîtrise ${lv}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=lv?'on':''}"></i>`).join('')}</div></div><button class="say" data-say="${esc(w.en)}" aria-label="Écouter ${esc(w.en)}">${SPK}</button></div>`}).join(''):'<p class="mut" style="padding:20px;text-align:center">Aucun mot ne correspond.</p>';$('#ll').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say))};
  draw();$('#lq').oninput=e=>{lexQ=e.target.value;draw()};
 }else{

 const verdict=pc===100?'Pavois complet, bravo !':pc>=80?'Excellent signaleur !':pc>=60?'Bonne lecture des signaux':pc>=40?'Encore quelques pavillons à hisser':'On révise le lexique et on recommence';
 V.innerHTML=`<div class="res card pop"><div class="mut small">Quiz pavillons${S.name?' · '+esc(S.name):''}</div><div class="stars">${[0,1,2].map(i=>STAR(i<stars)).join('')}</div>
 <h1 style="font-size:1.7rem">${verdict}</h1><div class="big" style="margin:10px 0 2px">+${R.score}</div><div class="mut">milles gagnés</div>
 <div class="kpis"><div class="kpi"><b>${R.ok}/${asked}</b><span>bonnes réponses</span></div><div class="kpi"><b>${pc}%</b><span>réussite</span></div><div class="kpi"><b>${R.best}</b><span>meilleure série</span></div></div>
 <div class="row wrap" style="margin-top:16px"><button class="btn sun" id="fag" style="flex:1">Rejouer</button><button class="btn ghost" id="flx" style="flex:1">Voir le lexique</button></div></div>
 ${R.misses.length?`<h2>À revoir (${R.misses.length})</h2><div class="card" style="padding:4px 14px">${R.misses.map(p=>`<div class="miss"><div style="width:64px">${flagSvg(p.id)}</div><div><b>${esc(p.id)} · ${esc(p.name)}</b><div class="small">${esc(p.fr)}</div></div><span></span></div>`).join('')}</div>`:''}
 <button class="btn ghost wide" id="fhm" style="margin-top:12px">Retour à l’accueil</button>`;
 $('#fag').onclick=()=>startF(R.cfg);$('#flx').onclick=()=>{pavTab='lex';go('pav')};$('#fhm').onclick=()=>go('home');
 document.body.classList.remove('inquiz');$('#nav').classList.remove('hidden');header();scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(!FQ)return;if(!FQ.locked&&/^[1-4]$/.test(e.key)){const b=V.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b&&!b.disabled)b.click()}else if(FQ.locked&&e.key==='Enter'&&$('#fnx')){e.preventDefault();$('#fnx').click()}});
/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{if(!Q)return;if(e.target.tagName==='INPUT'&&e.key!=='Enter')return;if(!Q.locked&&/^[1-4]$/.test(e.key)){const b=V.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b&&!b.disabled)b.click()}else if(Q.locked&&e.key==='Enter'&&$('#nx')){e.preventDefault();$('#nx').click()}});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(!S.name)return;if(FQ||MQ){modal('<h3>Quitter le quiz ?</h3><p class="mut">Les milles déjà gagnés sont conservés.</p>',()=>go(b.dataset.go));return}if(Q){modal('<h3>Quitter le quiz ?</h3><p class="mut">Les milles déjà gagnés sont conservés.</p>',()=>{stopQ();go(b.dataset.go)})}else go(b.dataset.go)});
$('#snd').onclick=()=>{S.sound=!S.sound;save();sndIcon();if(S.sound)sfx('ok')};
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}

/* ---------- boot ---------- */
V.innerHTML='<p class="mut" style="text-align:center;padding:40px 0">Chargement du lexique…</p>';
fetch('lexique.json').then(r=>r.json()).then(d=>{SECS=d.secs;W=d.words;SECS.forEach(s=>SEC[s.id]=s);if(!S.pid){S.pid='p'+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,20):Math.random().toString(36).slice(2)+Date.now().toString(36));save()}if(!S.secMig){S.wPts=Math.max(0,S.pts-S.fPts);S.secMig=1;save()}header();if(S.name){go('home');pushScore()}else gate()}).catch(()=>{V.innerHTML='<div class="card"><h3>Impossible de charger le lexique</h3><p class="mut">Vérifie ta connexion puis recharge la page.</p></div>'});
}
</script>
</body>
</html>
